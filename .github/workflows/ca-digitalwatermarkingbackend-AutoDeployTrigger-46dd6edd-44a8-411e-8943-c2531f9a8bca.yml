name: Trigger auto deployment for ca-digitalwatermarkingbackend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'backend/**'
    - '.github/workflows/ca-digitalwatermarkingbackend-AutoDeployTrigger-46dd6edd-44a8-411e-8943-c2531f9a8bca.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CADIGITALWATERMARKINGBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CADIGITALWATERMARKINGBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CADIGITALWATERMARKINGBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: crfastapix.azurecr.io
          username: ${{ secrets.CADIGITALWATERMARKINGBACKEND_REGISTRY_USERNAME }}
          password: ${{ secrets.CADIGITALWATERMARKINGBACKEND_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t crfastapix.azurecr.io/ca-digitalwatermarkingbackend:${{ github.sha }} \
            backend
          docker push crfastapix.azurecr.io/ca-digitalwatermarkingbackend:${{ github.sha }}

      - name: Deploy published image to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: crfastapix.azurecr.io/ca-digitalwatermarkingbackend:${{ github.sha }}
          registryUrl: crfastapix.azurecr.io
          registryUsername: ${{ secrets.CADIGITALWATERMARKINGBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CADIGITALWATERMARKINGBACKEND_REGISTRY_PASSWORD }}
          containerAppName: ca-digitalwatermarkingbackend
          resourceGroup: rg-digital-watermarking-service
          targetPort: 8000
          ingress: external
