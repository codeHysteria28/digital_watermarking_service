name: Trigger auto deployment for ca-digitalwatermarkingbackend

on:
  push:
    branches: 
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ca-digitalwatermarkingbackend-AutoDeployTrigger-46dd6edd-44a8-411e-8943-c2531f9a8bca.yml'

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CADIGITALWATERMARKINGBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CADIGITALWATERMARKINGBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CADIGITALWATERMARKINGBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: ./backend/Dockerfile
          registryUrl: crfastapix.azurecr.io
          registryUsername: ${{ secrets.CADIGITALWATERMARKINGBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CADIGITALWATERMARKINGBACKEND_REGISTRY_PASSWORD }}
          containerAppName: ca-digitalwatermarkingbackend
          resourceGroup: rg-digital-watermarking-service
          imageToBuild: crfastapix.azurecr.io/ca-digitalwatermarkingbackend:${{ github.sha }}
